    <script>
        tailwind.config = {
            theme: { extend: { colors: {
                'navy': { 950:'#01040a', 900:'#020b1a', 800:'#03162e', 700:'#052045', 600:'#0a2d5c', 500:'#0d3a73', 400:'#1a4d8c', 300:'#2d6bb0', 200:'#5a9bd4', 100:'#a8cce8', 50:'#e6f0f9' },

    <style>
        body { font-family:'Inter',sans-serif; }
        h1,h2,h3,h4,h5,h6 { font-family:'Montserrat',sans-serif; }
        .hero-bg { background:linear-gradient(135deg,#01040a 0%,#03162e 40%,#052045 70%,#0a2d5c 100%); }
        .btn-primary { background:linear-gradient(135deg,#0ea5e9 0%,#0284c7 100%); transition:all .3s cubic-bezier(.4,0,.2,1); }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 10px 40px -10px rgba(14,165,233,.5); }
        .success-check { animation:check .6s ease-in-out; }
        @keyframes check { 0%{transform:scale(0) rotate(45deg);opacity:0} 50%{transform:scale(1.2) rotate(45deg);opacity:1} 100%{transform:scale(1) rotate(45deg);opacity:1} }
        .pulse-ring { animation:pulseRing 2s ease-out infinite; }
        @keyframes pulseRing { 0%{transform:scale(1);opacity:.7} 100%{transform:scale(1.5);opacity:0} }
    </style>
</head>
<body class="hero-bg min-h-screen flex items-center justify-center px-4">

    <div class="max-w-lg w-full text-center">
        <!-- Success Animation -->
        <div class="relative inline-flex items-center justify-center mb-8">
            <div class="absolute w-24 h-24 rounded-full bg-cosmic-500/20 pulse-ring"></div>
            <div class="w-24 h-24 rounded-full bg-cosmic-500/20 flex items-center justify-center relative z-10">
                <svg class="w-12 h-12 text-cosmic-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" class="success-check"/>
                </svg>
            </div>
        </div>

        <h1 class="font-display font-bold text-3xl sm:text-4xl text-white mb-4">Order Received!</h1>
        <p class="text-gray-400 text-lg mb-2">Thank you for choosing Interstellar Prints Global.</p>
        <p class="text-gray-500 text-sm mb-8">We've received your request and will get back to you within 24 hours.</p>

            <p class="text-cosmic-300 text-xs font-medium tracking-wider uppercase mb-2">Your Order Reference</p>
            <p id="order-ref" class="font-display font-bold text-2xl text-white tracking-wide">Loading...</p>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">

        </div>

        <p class="text-gray-600 text-xs mt-8">© 2026 Interstellar Prints Global Ltd. — Your Brand, Everywhere.</p>
    </div>

    <script>
        // Extract order ref from URL params
        const params = new URLSearchParams(window.location.search);
        const ref = params.get('ref');
        if (ref) {
            document.getElementById('order-ref').textContent = ref;
        } else {
            document.getElementById('order-ref').textContent = 'N/A';
        }
    </script>
